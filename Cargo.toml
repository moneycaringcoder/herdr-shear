[package]
name = "shear"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Finds git worktrees that are safe to delete, and removes the ones you pick."
license = "MIT"
repository = "https://github.com/moneycaringcoder/herdr-shear"

# The binary target inherits the package name => target/release/shear, which is
# what every command in herdr-plugin.toml points at.

[dependencies]
crook = { git = "https://github.com/moneycaringcoder/herdr-crook", tag = "v0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }

# Unix-only: signal handling and the low-level terminal checks that support the
# review pane's crossterm lifecycle.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# `panic = "abort"` is deliberately NOT set. The review pane puts the terminal
# into raw mode and restores it from a panic hook and from Drop; aborting would
# skip the unwind and leave the user's pane unusable.
